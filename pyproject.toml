[project]
name = "pm-epa-nhl"
version = "1.0.0"
description = "Puck-Movement Expected Goals Added (PM-EPA): an EPA-style possession-value metric for NHL skaters from public play-by-play"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
# Runtime dependencies are pinned in requirements.txt for reproducibility; install with `make install`.

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731", "B905", "E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
