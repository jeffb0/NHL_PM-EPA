[project]
name = "pm-epa-nhl"
version = "1.0.0"
description = "Puck-Movement Expected Goals Added (PM-EPA): an EPA-style possession-value metric for NHL skaters from public play-by-play"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
# Runtime dependencies are pinned in requirements.txt (reproducibility); install with `make install`.

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731", "B905", "E501"]

[tool.black]
line-length = 140
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
